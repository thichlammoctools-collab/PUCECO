<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="farmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EFE2"/>
      <stop offset="100%" stop-color="#E4D6B0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="120" fill="url(#farmBg)" rx="8"/>
  <g transform="translate(100, 60)">
    <!-- Sun -->
    <circle cx="-35" cy="-20" r="14" fill="#F59E0B"/>
    <!-- Farm Mountains/Hills -->
    <path d="M-90 40 Q-40 -10 10 40 Z" fill="#84CC16" opacity="0.6"/>
    <path d="M-30 40 Q30 -15 90 40 Z" fill="#4D7C0F" opacity="0.75"/>
    <path d="M-70 40 Q-10 10 50 40 Z" fill="#15803D" opacity="0.85"/>
    <!-- Rows of crops -->
    <line x1="-50" y1="40" x2="-20" y2="25" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="40" x2="-5" y2="28" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="40" x2="10" y2="30" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
    <!-- Little plant -->
    <path d="M35 15 C30 5 40 -5 45 5 C50 -5 60 5 55 15" stroke="#166534" stroke-width="2" fill="#22C55E"/>
    <line x1="45" y1="12" x2="45" y2="30" stroke="#166534" stroke-width="2"/>
  </g>
</svg>
