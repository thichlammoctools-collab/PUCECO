<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="bgDrink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="80%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" rx="12" fill="url(#bgDrink)"/>
  <circle cx="120" cy="90" r="52" fill="#86EFAC" opacity="0.25"/>
  
  <g transform="translate(120, 90)">
    <!-- Drink Can Body -->
    <rect x="-24" y="-50" width="48" height="96" rx="10" fill="url(#canGrad)"/>
    <ellipse cx="0" cy="-50" rx="24" ry="7" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <ellipse cx="0" cy="-50" rx="16" ry="4" fill="#D1D5DB"/>
    <ellipse cx="0" cy="46" rx="24" ry="6" fill="#14532D"/>
    
    <!-- White brand badge on can -->
    <rect x="-18" y="-15" width="36" height="30" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <path d="M-6 0 C-6 -8 6 -8 6 0 C6 8 -6 8 -6 0 Z" fill="#15803D"/>
    <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#16A34A" stroke-width="1.5"/>
    
    <!-- Refreshing bubbles -->
    <circle cx="38" cy="-25" r="4.5" fill="#22C55E" opacity="0.6"/>
    <circle cx="48" cy="10" r="3" fill="#22C55E" opacity="0.7"/>
    <circle cx="-38" cy="15" r="5" fill="#22C55E" opacity="0.5"/>
    <circle cx="-42" cy="-20" r="3.5" fill="#22C55E" opacity="0.6"/>
    
    <!-- Botanical leaf -->
    <path d="M22 -40 C35 -55 52 -45 42 -30 C32 -30 25 -35 22 -40 Z" fill="#16A34A"/>
  </g>
</svg>
