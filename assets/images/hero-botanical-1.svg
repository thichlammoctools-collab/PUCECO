<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle aura -->
  <circle cx="120" cy="120" r="90" fill="#22C55E" opacity="0.12" filter="url(#glow)"/>
  <!-- Central botanical leaf cluster -->
  <path d="M120 30 C170 65 190 125 150 175 C135 195 120 205 120 205 C120 205 105 195 90 175 C50 125 70 65 120 30 Z" fill="url(#leafGrad1)"/>
  <path d="M120 40 L120 195" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Leaf veins -->
  <path d="M120 80 Q145 70 160 85" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 110 Q150 100 165 120" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 140 Q140 135 150 155" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 80 Q95 70 80 85" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 110 Q90 100 75 120" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 140 Q100 135 90 155" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Small side leaf -->
  <path d="M110 160 C70 160 50 130 65 100 C75 125 90 145 110 160 Z" fill="#86EFAC" opacity="0.65"/>
  <path d="M130 160 C170 160 190 130 175 100 C165 125 150 145 130 160 Z" fill="#4ADE80" opacity="0.65"/>
  <!-- Pure dew drops -->
  <circle cx="140" cy="95" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="95" cy="130" r="3.5" fill="#FFFFFF" opacity="0.75"/>
</svg>
