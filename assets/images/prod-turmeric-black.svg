<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="btBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F1EA"/>
      <stop offset="100%" stop-color="#A6D0BC"/>
    </linearGradient>
    <linearGradient id="blackTurmeric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#btBg)" rx="8"/>
  <circle cx="100" cy="75" r="48" fill="#D1FAE5" opacity="0.5"/>
  <!-- Black Turmeric (Curcuma caesia) characterized by deep bluish-black core -->
  <g transform="translate(100, 75)">
    <!-- Root body -->
    <path d="M-35 15 C-42 -2 -22 -20 8 -12 C28 -8 46 2 38 20 C30 32 8 28 -12 28 C-25 28 -30 22 -35 15 Z" fill="url(#blackTurmeric)"/>
    <path d="M-20 -10 Q-16 5 -14 24" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M-2 -8 Q2 6 4 24" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Cross section slice with characteristic blue-black concentric circles -->
    <ellipse cx="28" cy="-4" rx="16" ry="19" fill="#1E293B" stroke="#0F172A" stroke-width="2.5" transform="rotate(-15 28 -4)"/>
    <ellipse cx="28" cy="-4" rx="12" ry="14" fill="url(#purpleRing)" opacity="0.8" transform="rotate(-15 28 -4)"/>
    <ellipse cx="28" cy="-4" rx="6" ry="7" fill="#38BDF8" opacity="0.75" transform="rotate(-15 28 -4)"/>
  </g>
</svg>
