<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="curcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0EC"/>
      <stop offset="100%" stop-color="#BBD9CA"/>
    </linearGradient>
    <linearGradient id="turmericGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#curcBg)" rx="8"/>
  <circle cx="100" cy="75" r="48" fill="#FDE68A" opacity="0.4"/>
  <!-- Turmeric Root & Nano spheres -->
  <g transform="translate(100, 75)">
