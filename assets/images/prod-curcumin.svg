    <path d="M-2 -12 Q3 5 4 25" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M18 -5 Q22 8 20 22" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Slice of Turmeric showing rich orange -->
    <ellipse cx="32" cy="-5" rx="14" ry="18" fill="#F97316" stroke="#B45309" stroke-width="2.5" transform="rotate(-15 32 -5)"/>
    <ellipse cx="32" cy="-5" rx="9" ry="12" fill="#FBBF24" opacity="0.85" transform="rotate(-15 32 -5)"/>
    <!-- Glowing Nano particles -->
    <circle cx="-25" cy="-25" r="5" fill="#F59E0B"/>
    <circle cx="-15" cy="-34" r="3.5" fill="#FBBF24"/>
    <circle cx="0" cy="-28" r="4" fill="#F59E0B"/>
    <circle cx="18" cy="-32" r="3" fill="#FDE68A"/>
