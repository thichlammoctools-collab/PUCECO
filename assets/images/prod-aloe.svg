<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="aloeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEFE6"/>
      <stop offset="100%" stop-color="#D2D6B8"/>
    </linearGradient>
    <linearGradient id="leafAloe" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="70%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#aloeBg)" rx="8"/>
  <circle cx="100" cy="75" r="48" fill="#ECFDF5" opacity="0.6"/>
  <!-- Aloe Vera rosette & transparent gel cube -->
  <g transform="translate(100, 75)">
    <!-- Center succulent leaf -->
    <path d="M-8 35 C-12 10 -6 -25 0 -45 C6 -25 12 10 8 35 Z" fill="url(#leafAloe)"/>
    <!-- Left leaf -->
    <path d="M-6 35 C-25 18 -38 -5 -40 -25 C-30 -12 -15 15 0 35 Z" fill="#16A34A"/>
    <!-- Right leaf -->
    <path d="M6 35 C25 18 38 -5 40 -25 C30 -12 15 15 0 35 Z" fill="#15803D"/>
    <!-- Teeth on edges -->
    <circle cx="-12" cy="0" r="1.5" fill="#DCFCE7"/>
    <circle cx="-22" cy="-10" r="1.5" fill="#DCFCE7"/>
    <circle cx="12" cy="0" r="1.5" fill="#DCFCE7"/>
    <circle cx="22" cy="-10" r="1.5" fill="#DCFCE7"/>
    <!-- Clear Gel drop -->
    <g transform="translate(20, 22)">
      <rect x="-10" y="-10" width="20" height="20" rx="5" fill="#6EE7B7" fill-opacity="0.45" stroke="#10B981" stroke-width="1.5" transform="rotate(15)"/>
      <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>
</svg>
