# Cloudflare Pages & D1 / R2 Configuration
name = "puceco"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "puceco-db"
database_id = "0d698212-a463-464f-9a1b-317b34c76e38"

# Cloudflare R2 Bucket binding (Media & Images)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "puceco-media"
